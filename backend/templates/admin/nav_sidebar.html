{% load i18n %}
<nav class="sticky" id="nav-sidebar" aria-label="{% translate 'Sidebar' %}">
    <div class="sc-sidebar-brand-row">
        <a class="sc-sidebar-brand" href="{% url 'admin:index' %}">
            <span class="sc-sidebar-logo" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M7 23.5 13.2 7l4 4-6.7 16zM18 7l7 7-3 3-7-7zM14 24h12v3H13z"/></svg>
            </span>
            <span class="sc-sidebar-brand-copy">SocialConnect<small>ADMIN PANEL</small></span>
        </a>
        <button id="sc-sidebar-collapse" class="sc-sidebar-collapse" type="button" aria-label="Collapse navigation" aria-expanded="true" aria-controls="nav-sidebar" title="Collapse navigation" data-sc-sidebar-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
        </button>
    </div>
    <input id="nav-filter" class="sc-nav-filter" type="search" placeholder="Filter navigation..." aria-label="Filter admin navigation" autocomplete="off">

    <div class="sc-sidebar-navigation">
        {% for group in sc_navigation_groups %}
        <section class="sc-sidebar-group">
            <h2>{{ group.label }}</h2>
            <ul>
                {% for item in group.items %}
                <li>
                    {% if item.logout %}
                    <form method="post" action="{% url 'admin:logout' %}">
                        {% csrf_token %}
                        <button class="sc-sidebar-link sc-sidebar-logout" type="submit" aria-label="{{ item.label }}" title="{{ item.label }}" data-sc-confirm="Sign out of the SocialConnect admin panel?">
                    {% else %}
                    <a class="sc-sidebar-link{% if item.active %} is-active{% endif %}" href="{{ item.url }}" aria-label="{{ item.label }}" title="{{ item.label }}"{% if item.active %} aria-current="page"{% endif %}>
                    {% endif %}
                        <span class="sc-nav-accent" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            {% if item.icon == "dashboard" %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
                            {% elif item.icon == "analytics" %}<path d="M4 20V10M10 20V4m6 16v-7m4 7H2"/>
                            {% elif item.icon == "users" %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                            {% elif item.icon == "posts" %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/>
                            {% elif item.icon == "comments" or item.icon == "messages" %}<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5Z"/>
                            {% elif item.icon == "likes" %}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
                            {% elif item.icon == "follows" %}<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6m-3-3h6"/>
                            {% elif item.icon == "friend_requests" %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm12-5v6m-3-3h6"/>
                            {% elif item.icon == "stories" %}<circle cx="9" cy="12" r="6"/><circle cx="17" cy="12" r="4"/><path d="M9 6v12"/>
                            {% elif item.icon == "reports" %}<path d="M5 21V4m0 1h12l-2 4 2 4H5"/>
                            {% elif item.icon == "admin" %}<path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>
                            {% elif item.icon == "roles" %}<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8m-3 3 2 2m-4 0 2 2"/>
                            {% elif item.icon == "activity" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
                            {% elif item.icon == "system" %}<path d="M4 6h10m4 0h2M4 12h3m4 0h9M4 18h12m4 0h0"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
                            {% elif item.icon == "notifications" %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
                            {% elif item.icon == "settings" %}<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z"/>
                            {% elif item.icon == "website" %}<path d="M14 3h7v7M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            {% else %}<path d="M10 17l5-5-5-5M15 12H3M21 3v18"/>
                            {% endif %}
                        </svg>
                        <span>{{ item.label }}</span>
                    {% if item.logout %}</button></form>{% else %}</a>{% endif %}
                </li>
                {% endfor %}
            </ul>
        </section>
        {% endfor %}
    </div>
</nav>

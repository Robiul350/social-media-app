<text x="76" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="" fill="#64748B" text-anchor="start" dominant-baseline="text-before-edge">STATE-001</text>
<text x="76" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="" fill="#475569" text-anchor="start" dominant-baseline="text-before-edge">• send → pending</text>
<text x="76" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="" fill="#475569" text-anchor="start" dominant-baseline="text-before-edge">• accept → accepted</text>
<text x="76" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="" fill="#475569" text-anchor="start" dominant-baseline="text-before-edge">• reject → rejected</text>
<text x="76" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" font-style="" fill="#475569" text-anchor="start" dominant-baseline="text-before-edge">• delete cancels pending</text>
<rect x="435" y="176" width="330" height="180" rx="12" fill="#C3CAD5" stroke="none" stroke-width="1"/>
<rect x="430" y="170" width="330" height="180" rx="12" fill="#E8F0FE" stroke="#2563EB" stroke-width="2"/>
